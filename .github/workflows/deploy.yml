# 축의대 — 태그를 달 때만 배포합니다.
#
# main 에 push 해도 사이트는 바뀌지 않습니다. 실제 배포는 v로 시작하는 태그를
# 올릴 때만 일어납니다. 라이브 사이트에 실수로 반영되는 것을 막기 위한 장치입니다.
#
#   git tag -a v1.2.0 -m "설명"
#   git push origin v1.2.0        ← 이때 배포
#
# Actions 탭에서 "Run workflow" 로 수동 배포도 가능합니다.
name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 정적 사이트라 빌드가 없습니다. 저장소 전체를 그대로 올립니다.
      # 루트의 CNAME 파일이 함께 올라가 커스텀 도메인(축의대.com)이 유지됩니다.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
